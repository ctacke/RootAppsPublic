[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noderoot-bot"
version = "0.1.0"
description = "Python SDK for writing self-hosted Node-ROOT bots over webhooks"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Chris Tacke" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []
